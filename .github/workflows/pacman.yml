name: generate arcade games
on:
  schedule:                # автозапуск раз в сутки
    - cron: "0 0 * * *"
  workflow_dispatch:       # ручной запуск
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate bomberman SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "bomberman"
      - name: generate 3D contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: copy dark 3D SVG into dist
        run: |
          mkdir -p dist
          cp profile-3d-contrib/profile-night-green.svg dist/github-3d.svg
      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
